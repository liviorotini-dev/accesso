<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Accesso riservato</title>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<style>
.gate{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(360px,100%);display:grid;gap:12px;padding:26px}
.gate .brand{margin:0 0 6px;color:var(--fg)}
.gate label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.gate input[type=text],.gate input[type=password]{width:100%;font-size:15px}
.gate .chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--fg)}
.gate .err{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.gate button{font-size:15px;padding:10px}
</style>
<div id="gate" class="gate">
  <form id="gf" class="card" autocomplete="on">
    <div class="brand" style="color:var(--fg)"><div class="logo">R</div><div><b>Regia</b><small style="color:var(--muted)">Accesso riservato</small></div></div>
    <label for="gu">Utente<input id="gu" type="text" autocomplete="username" autocapitalize="none" required></label>
    <label for="gp">Password<input id="gp" type="password" autocomplete="current-password" required></label>
    <label class="chk" for="gr"><input id="gr" type="checkbox"> Ricordami su questo dispositivo</label>
    <button type="submit" id="gb" class="btn pri">Entra</button>
    <p class="err" id="ge"></p>
  </form>
</div>
<div class="shell">
  <aside id="side">
    <div class="brand"><div class="logo">R</div><div><b>Regia</b><small id="gname">Gestionale di gruppo</small></div></div>
    <button id="menuBtn" class="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav id="nav"></nav>
    <div class="who"><label for="whoSel">Sto lavorando per</label><select id="whoSel"></select>
      <label for="whoName">Il mio nome</label><input id="whoName" type="text" placeholder="Nome" autocomplete="given-name"></div>
    <div id="engine" class="engine">Salvato su questo dispositivo</div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="data/vault.js"></script>
<script>
(() => {
  'use strict';
  const V = window.VAULT, C = crypto.subtle, enc = new TextEncoder();
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => btoa(String.fromCharCode(...u));
  const KEEP = 'regia_key_' + V.salt.slice(0, 8);
  const $ = s => document.querySelector(s);
  async function derive(u, p) {
    const base = await C.importKey('raw', enc.encode(u.trim().toLowerCase() + '\n' + p), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await C.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64d(V.salt), iterations: V.iter }, base, 768));
  }
  async function unlock(bits) {
    const iv = b64d(V.iv), ct = b64d(V.ct), msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
    const mk = await C.importKey('raw', bits.slice(32, 64), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    if (!await C.verify('HMAC', mk, b64d(V.mac), msg)) return false;
    const ek = await C.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    Object.assign(window, JSON.parse(new TextDecoder().decode(await C.decrypt({ name: 'AES-CBC', iv }, ek, ct))));
    window.ER_DBKEY = await C.importKey('raw', bits.slice(64, 96), 'AES-GCM', false, ['encrypt', 'decrypt']);
    window.ER_DBSALT = V.salt;
    return true;
  }
  function start() {
    $('#gate').remove();
    const out = document.createElement('a'); out.href = '#'; out.textContent = 'Esci'; out.className = 'small';
    out.style.cssText = 'color:var(--side-mute);font-size:12px;padding:0 6px';
    out.onclick = e => { e.preventDefault(); try { localStorage.removeItem(KEEP); } catch (x) { } location.reload(); };
    $('#side').appendChild(out);
    const s = document.createElement('script'); s.textContent = window.ER_APP; delete window.ER_APP; document.body.appendChild(s);
  }
  (async () => {
    let kept = null; try { kept = localStorage.getItem(KEEP); } catch (e) { }
    if (kept) { try { if (await unlock(b64d(kept))) return start(); } catch (e) { } }
    $('#gu').focus();
  })();
  $('#gf').addEventListener('submit', async e => {
    e.preventDefault();
    $('#gb').disabled = true; $('#ge').textContent = 'Controllo…';
    try {
      const bits = await derive($('#gu').value, $('#gp').value);
      if (await unlock(bits)) {
        if ($('#gr').checked) { try { localStorage.setItem(KEEP, b64e(bits)); } catch (x) { } }
        return start();
      }
      $('#ge').textContent = 'Utente o password errati.';
    } catch (x) { $('#ge').textContent = 'Questo browser non riesce ad aprire i dati. Usa Chrome o Safari aggiornati.'; }
    $('#gb').disabled = false; $('#gp').select();
  });
})();
</script>

</body></html>
